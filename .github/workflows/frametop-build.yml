---
# Frametop's build of Vibepollo 2.0.0 (https://github.com/DeeJanuz/frametop): sunshine.exe, which
# Frametop's Windows host setup swaps in over the stock one, and the Arch Linux package, on
# Depot's runners (the Frametop org's Depot GitHub app). It runs when started by hand (Actions
# -> Frametop build -> Run workflow), which keeps the files as artifacts, and on a frametop-*
# tag, which also publishes them as a GitHub release, each with its SHA-256
# (.github/frametop-publish.sh, notes in .github/frametop-release-notes.md). Upstream's ci.yml
# skips frametop/ branches and frametop-* tags, so this is the only build of them.
#
# The Windows steps follow ci-windows.yml (same MSYS2 packages, pinned WebRTC and configure
# options) without the installer, drivers, signing or symbols, which the exe swap doesn't use.
name: Frametop build
permissions: {}

on:
  workflow_dispatch:
  push:
    tags:
      - 'frametop-*'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  windows:
    name: Windows sunshine.exe
    runs-on: depot-windows-2022-8
    permissions:
      contents: read
    env:
      BUILD_VERSION: 2.0.0
      NODE_VERSION: 22.22.2
      CMAKE_BUILD_PARALLEL_LEVEL: 8
      WEBRTC_ROOT: ${{ github.workspace }}\.vibepollo-deps\libwebrtc\out
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Dependencies Windows
        id: setup-msys2
        uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda  # v2.30.0
        with:
          msystem: ucrt64
          update: true
          cache: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-tools

      - name: Setup NodeJS
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238  # v6.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            src_assets/common/assets/web/package-lock.json
            src_assets/common/assets/web-legacy/package-lock.json

      - name: NodeJS Path
        shell: pwsh
        run: |
          $nodePath = Split-Path -Path (Get-Command node).Source -Parent
          "NODEJS_PATH=$nodePath" >> $env:GITHUB_ENV

      - name: Resolve WebRTC toolchain
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.setup-msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe was not found at $vswhere" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsPath) -or -not (Test-Path -LiteralPath $vsPath)) {
            throw 'Visual Studio with the VC toolchain was not found.'
          }
          $kitsRoot = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -Name KitsRoot10).KitsRoot10
          if ([string]::IsNullOrWhiteSpace($kitsRoot) -or -not (Test-Path -LiteralPath $kitsRoot)) {
            throw 'Windows SDK KitsRoot10 was not found.'
          }
          $msys2Bin = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          if (-not (Test-Path -LiteralPath $msys2Bin)) { throw "MSYS2 bin directory was not found: $msys2Bin" }
          "WEBRTC_VS_PATH=$vsPath" >> $env:GITHUB_ENV
          "WEBRTC_WINSDK_DIR=$kitsRoot" >> $env:GITHUB_ENV
          "WEBRTC_MSYS2_BIN=$msys2Bin" >> $env:GITHUB_ENV

      - name: Download pinned WebRTC artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\download_webrtc_release.ps1 `
            -ManifestPath .\third-party\webrtc-artifacts\windows-x64.json `
            -OutDir $env:WEBRTC_ROOT `
            -GitHubToken $env:GH_TOKEN

      - name: Build
        run: |
          set -euo pipefail
          NODEJS_PATH=$(cygpath -u "$NODEJS_PATH")
          export PATH="${NODEJS_PATH}:$PATH"
          NPM_PATH="$(cygpath -m "${NODEJS_PATH}/npm.cmd")"
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DBUILD_WERROR=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_SUNSHINE_VIRTUAL_DISPLAY_DRIVER=OFF \
            -DBUILD_VIRTUALDISPLAY_PROBE=OFF \
            -DBUILD_VIRTUALDISPLAY_TOOLS=OFF \
            -DBUILD_VIRTUALDISPLAY_VULKAN_LAYER=OFF \
            -DBUILD_DOCS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG" \
            -DSUNSHINE_ENABLE_WEBRTC=ON \
            -DWEBRTC_ROOT="$(cygpath -u "${WEBRTC_ROOT}")" \
            -DWEBRTC_INCLUDE_DIR="$(cygpath -u "${WEBRTC_ROOT}")/include" \
            -DWEBRTC_LIBRARY="$(cygpath -u "${WEBRTC_ROOT}")/lib/libwebrtc.dll.a" \
            -DWEBRTC_MSYS2_BIN="$(cygpath -u "${WEBRTC_MSYS2_BIN}")" \
            -DWEBRTC_VS_PATH="$(cygpath -u "${WEBRTC_VS_PATH}")" \
            -DWEBRTC_WINSDK_DIR="$(cygpath -u "${WEBRTC_WINSDK_DIR}")" \
            -DSUNSHINE_NPM_EXECUTABLE="${NPM_PATH}" \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME="Frametop" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/Frametop/frametop-vibepollo" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/DeeJanuz/frametop/issues"
          echo "::add-matcher::.github/matchers/gcc.json"
          cmake --build build --target sunshine test_sunshine --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
          echo "::remove-matcher owner=gcc::"

      # The suites Frametop's changes touch (the Remote Monitor release, the Frametop display
      # role and the RTSP policy for it).
      - name: Test
        run: |
          set -euo pipefail
          export PATH="$(cygpath -u "${WEBRTC_ROOT}")/bin:$(cygpath -u "${WEBRTC_ROOT}")/lib:$PATH"
          ./build/tests/test_sunshine.exe --gtest_filter='RemoteDisplayTopology.*:RemoteSession.*:RtspPendingPolicy.*'

      # The exe goes into an existing Vibepollo 2.0.0 install, so it may only load DLLs that
      # Windows or that install has.
      - name: Check DLLs and package
        run: |
          set -euo pipefail
          strip --strip-all build/sunshine.exe
          bad=0
          for dll in $(objdump -p build/sunshine.exe | sed -n 's/^\s*DLL Name: //p' | tr -d '\r'); do
            lower=$(echo "$dll" | tr '[:upper:]' '[:lower:]')
            case $lower in
              libwebrtc.dll|zlib1.dll) echo "from the install: $dll" ;;
              *) if [ -e "/c/Windows/System32/$dll" ]; then echo "from Windows: $dll"; else echo "::error::not in Windows or the install: $dll"; bad=1; fi ;;
            esac
          done
          [ "$bad" = 0 ]
          mkdir -p dist
          cp build/sunshine.exe dist/
          printf 'Vibepollo %s with Frametop'"'"'s changes\ncommit %s (%s)\n' "$BUILD_VERSION" "$GITHUB_SHA" "$GITHUB_REF_NAME" > dist/BUILD-INFO.txt
          sha256sum dist/sunshine.exe

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frametop-windows
          path: dist/
          retention-days: 14

  archlinux:
    name: Arch Linux package
    permissions:
      contents: read
    uses: ./.github/workflows/ci-archlinux.yml
    with:
      runner: depot-ubuntu-24.04-8
      artifact_retention_days: 14
      release_commit: ${{ github.sha }}
      release_version: 2.0.0

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/frametop-')
    needs:
      - windows
      - archlinux
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Download
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(find artifacts/build-Archlinux -maxdepth 1 -name 'vibepollo-*.pkg.tar.zst' ! -name '*-debug-*')
          [ "${#pkgs[@]}" = 1 ] || { echo "expected one Arch package, found ${#pkgs[@]}" >&2; exit 1; }
          bash .github/frametop-publish.sh "$TAG" artifacts/frametop-windows/sunshine.exe "${pkgs[0]}"
